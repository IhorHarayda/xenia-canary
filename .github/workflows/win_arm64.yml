name: Linux ARM64 Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: canary_experimental)'
        required: false
        default: 'canary_experimental'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      # 2. Setup native ARM64 build environment
      - name: Setup build environment
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null

          sudo add-apt-repository \
            "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main"

          sudo apt-get update

          sudo apt-get install -y \
            mesa-vulkan-drivers \
            valgrind \
            libc++-dev \
            libc++abi-dev \
            libgtk-3-dev \
            libsdl2-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            clang-18 \
            lld-18 \
            spirv-tools \
            glslang-tools \
            p7zip-full

          # Pin all LLVM tools to the same version.
          # This is important for LLVM bitcode and LTO compatibility.
          sudo update-alternatives --install \
            /usr/bin/clang \
            clang \
            /usr/bin/clang-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/clang++ \
            clang++ \
            /usr/bin/clang++-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/lld \
            lld \
            /usr/bin/lld-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/ld.lld \
            ld.lld \
            /usr/bin/ld.lld-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-ar \
            llvm-ar \
            /usr/bin/llvm-ar-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-ranlib \
            llvm-ranlib \
            /usr/bin/llvm-ranlib-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-nm \
            llvm-nm \
            /usr/bin/llvm-nm-18 \
            200

          echo "=== Compiler ==="
          clang --version
          clang++ --version

          echo "=== Linker ==="
          ld.lld --version

          echo "=== LLVM tools ==="
          llvm-ar --version
          llvm-ranlib --version
          llvm-nm --version

          echo "=== Shader tools ==="
          glslangValidator --version
          spirv-opt --version
          spirv-dis --version

      # 3. Download all submodules
      #
      # Exactly like the Windows ARM64 build:
      # no architecture-specific submodules are excluded.
      #
      # xbyak_aarch64 is required by the native ARM64 JIT backend.
      - name: Download submodules
        run: |
          git submodule update \
            --init \
            --depth=1 \
            -j"$(nproc)"

      # 4. Generate version.h
      - name: Generate version.h
        run: |
          mkdir -p build

          branch=$(git symbolic-ref --short -q HEAD || echo "detached")
          commit=$(git rev-parse HEAD)
          commit_short=$(git rev-parse --short HEAD)

          cat <<EOF > build/version.h
          // Autogenerated for Native ARM64 Build
          #ifndef GENERATED_VERSION_H_
          #define GENERATED_VERSION_H_

          #define XE_BUILD_BRANCH "$branch"
          #define XE_BUILD_COMMIT "$commit"
          #define XE_BUILD_COMMIT_SHORT "$commit_short"
          #define XE_BUILD_DATE __DATE__

          #endif // GENERATED_VERSION_H_
          EOF

      # 5. Native CMake configure
      #
      # We intentionally do not use xenia-build.py.
      # The build is configured directly for native ARM64.
      - name: CMake Configure (Native ARM64)
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXENIA_BUILD_TESTS=OFF

      # 6. Build
      - name: Build via Ninja
        run: |
          cmake \
            --build build \
            --config Release \
            --target xenia-app \
            --parallel "$(nproc)"

      # 7. Prepare artifacts
      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          binary="build/bin/Linux/Release/xenia_canary"

          if [ ! -f "$binary" ]; then
            echo "::error::Binary not found: $binary"
            exit 1
          fi

          if [ "$(stat -c%s "$binary")" -le 100000 ]; then
            echo "::error::Binary is too small."
            exit 1
          fi

          chmod +x "$binary"

          archive="xenia_canary_linux_arm64.7z"

          7z a \
            "$archive" \
            "$binary" \
            LICENSE \
            -mx9 \
            -bb3

          if [ ! -f "$archive" ] || [ "$(stat -c%s "$archive")" -le 100000 ]; then
            echo "::error::Archive is too small or was not created."
            exit 1
          fi

          echo "path=$archive" >> "$GITHUB_OUTPUT"

      # 8. Upload artifact
      - name: Upload Xenia Canary ARM64 artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
