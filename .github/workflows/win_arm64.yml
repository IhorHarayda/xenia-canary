name: Windows (ARM64 Native)

on:
  workflow_call:

jobs:
  build:
    name: Build
    # Використовуємо нативний Windows 11 ARM64 раннер із встановленою Visual Studio
    runs-on: windows-11-vs2026-arm

    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 1. Налаштовуємо нативне ARM64 оточення розробника MSVC
      - name: Setup MSVC for ARM64 (Native)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK
          key: ${{ runner.os }}-vulkan-sdk-native-arm64-${{ hashFiles('**/vulkan-sdk.exe') }}
          restore-keys: ${{ runner.os }}-vulkan-sdk-native-arm64-

      - name: Install Vulkan SDK with spirv-tools
        run: |-
          if (Test-Path "C:\VulkanSDK") {
            echo "Vulkan SDK found in cache."
          } else {
            # Використовуємо офіційний прямий лінк на завантаження інсталятора Vulkan SDK
            Invoke-WebRequest -Uri "https://lunarg.com" -OutFile "vulkan-sdk.exe"
            Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          }
          $env:VULKAN_SDK = "C:\VulkanSDK\$(Get-ChildItem -Path 'C:\VulkanSDK' -Directory | Select-Object -First 1 -ExpandProperty Name)"
          $env:PATH += "${env:VULKAN_SDK}\Bin"
          echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          echo "${env:VULKAN_SDK}\Bin" >> $env:GITHUB_PATH

          # Перевіряємо інструменти шейдерів у папці Vulkan SDK
          foreach ($tool in @("glslangValidator", "spirv-opt", "spirv-dis")) {
            $toolPath = "${env:VULKAN_SDK}\Bin\${tool}.exe"
            if (Test-Path "$toolPath") {
              echo "$tool found at: $toolPath"
              & $toolPath --version 2>$null
            } else {
              echo "Warning: ${tool}.exe not found at expected location"
            }
          }

          # На ARM64 машині шукаємо fxc.exe у нативній arm64 або x64 папці Windows SDK для компіляції шейдерів DirectX
          $fxcPaths = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\*\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($fxcPaths) {
            $fxcPath = $fxcPaths[-1].FullName
            echo "FXC found at: $fxcPath"
          } else {
            echo "Warning: fxc.exe not found in Windows SDK"
          }

      # 2. Оновлений фільтр субмодулів: виключаємо x86-версію xbyak та risc, підтягуємо xbyak_aarch64
      - name: Download submodules
        run: |-
          $SUBMODULES=(Select-String -CaseSensitive '(?<=path = )(?!third_party\/xbyak)(?!third_party\/xbyak_riscv).+' .gitmodules).Matches.Value
          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS $SUBMODULES

      # 3. Нативна збірка через скрипт проєкту (запуститься нативно як arm64-процес)
      - name: Build Xenia
        run: python xenia-build.py build --config=Release --target=xenia-app

      # 4. Пакування результату в архів
      - name: Prepare artifacts
        id: prepare_artifacts
        run: |-
          if ((Get-Item "build\bin\Windows\Release\xenia_canary.exe").Length -le 100000) {
            echo "::error:: Executable is too small."
            exit 1
          }
          $path="xenia_canary_windows_arm64.7z"
          7z a $path .\build\bin\Windows\Release\xenia_canary.exe LICENSE -mx9 -bb3
          if ((Get-Item "$path").Length -le 100000) {
            echo "::error:: Archive is too small."
            exit 1
          }
          echo "path=$path" >> $env:GITHUB_OUTPUT

      # 5. Завантаження нативного ARM64 артефакту в GitHub Actions
      - name: Upload Xenia Canary artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
