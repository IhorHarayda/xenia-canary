name: Windows ARM64 Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: canary_experimental)'
        required: false
        default: 'canary_experimental'

jobs:
  build:
    name: Build
    # Використовуємо виключно нативний Windows 11 ARM64 раннер
    runs-on: windows-11-vs2026-arm

    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      # 1. Чек-аут (повна історія для git info)
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      # 2. Setup MSVC ARM64 native (хост ARM64 -> ціль ARM64)
      - name: Setup MSVC for ARM64 (Native)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # 3. Cache Vulkan SDK
      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK
          key: ${{ runner.os }}-vulkan-sdk-native-arm64-${{ hashFiles('**/vulkan-sdk.exe') }}
          restore-keys: ${{ runner.os }}-vulkan-sdk-native-arm64-

      # 4. Install Vulkan SDK
      - name: Install Vulkan SDK with spirv-tools
        run: |-
          if (Test-Path "C:\VulkanSDK") {
            echo "Vulkan SDK found in cache."
          } else {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
            Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          }
          $env:VULKAN_SDK = "C:\VulkanSDK\$(Get-ChildItem -Path 'C:\VulkanSDK' -Directory | Select-Object -First 1 -ExpandProperty Name)"
          $env:PATH += "${env:VULKAN_SDK}\Bin"
          echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          echo "${env:VULKAN_SDK}\Bin" >> $env:GITHUB_PATH

      # 5. Download submodules (без xbyak_aarch64)
      - name: Download submodules
        run: |-
          $SUBMODULES=(Select-String -CaseSensitive '(?<=path = )(?!third_party\/xbyak_aarch64).+' .gitmodules).Matches.Value
          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS $SUBMODULES

      # 6. Generate version.h
      - name: Generate version.h
        run: |-
          mkdir build -ErrorAction SilentlyContinue
          $branch = git symbolic-ref --short -q HEAD
          $commit = git rev-parse HEAD
          $commit_short = git rev-parse --short HEAD
          $contents = @"
          // Autogenerated for Native ARM64 Build
          #ifndef GENERATED_VERSION_H_
          #define GENERATED_VERSION_H_
          #define XE_BUILD_BRANCH "$branch"
          #define XE_BUILD_COMMIT "$commit"
          #define XE_BUILD_COMMIT_SHORT "$commit_short"
          #define XE_BUILD_DATE __DATE__
          #endif // GENERATED_VERSION_H_
          "@
          Set-Content -Path "build\version.h" -Value $contents

      # 7. Native CMake configure
      - name: CMake Configure (Native ARM64)
        run: |-
          cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_BUILD_TYPE=Release -DXENIA_BUILD_TESTS=OFF

      # 8. Build
      - name: Build via Ninja
        run: |-
          cmake --build build --config Release --target xenia-app

      # 9. Prepare artifacts
      - name: Prepare artifacts
        id: prepare_artifacts
        run: |-
          if ((Get-Item "build\bin\Windows\Release\xenia_canary.exe").Length -le 100000) {
            echo "::error:: Executable is too small."
            exit 1
          }
          $path="xenia_canary_windows_arm64.7z"
          7z a $path .\build\bin\Windows\Release\xenia_canary.exe LICENSE -mx9 -bb3
          if ((Get-Item "$path").Length -le 100000) {
            echo "::error:: Archive is too small."
            exit 1
          }
          echo "path=$path" >> $env:GITHUB_OUTPUT

      # 10. Upload artifact
      - name: Upload Xenia Canary ARM64 artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
