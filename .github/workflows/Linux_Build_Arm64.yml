name: Linux ARM64 Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: canary_experimental)'
        required: false
        default: 'canary_experimental'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      # 2. Cache Vulkan SDK
      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk-linux
        uses: actions/cache@v6
        with:
          path: ~/vulkan-sdk
          key: ${{ runner.os }}-vulkan-sdk-latest-arm64

      # 3. Setup build environment
      - name: Setup build environment
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null

          sudo add-apt-repository \
            "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main"

          sudo apt-get update

          sudo apt-get install -y \
            mesa-vulkan-drivers \
            valgrind \
            libc++-dev \
            libc++abi-dev \
            libgtk-3-dev \
            libsdl2-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            clang-18 \
            lld-18 \
            spirv-tools \
            p7zip-full

          # Pin LLVM tools to the same version.
          # This is important for LTO/LLVM bitcode compatibility.
          sudo update-alternatives --install \
            /usr/bin/clang \
            clang \
            /usr/bin/clang-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/clang++ \
            clang++ \
            /usr/bin/clang++-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/lld \
            lld \
            /usr/bin/lld-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/ld.lld \
            ld.lld \
            /usr/bin/ld.lld-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-ar \
            llvm-ar \
            /usr/bin/llvm-ar-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-ranlib \
            llvm-ranlib \
            /usr/bin/llvm-ranlib-18 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-nm \
            llvm-nm \
            /usr/bin/llvm-nm-18 \
            200

      # 4. Install Vulkan SDK
      - name: Install Vulkan SDK
        run: |
          if [ "${{ steps.cache-vulkan-sdk-linux.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/vulkan-sdk

            wget -qO vulkan-sdk.tar.xz \
              https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz

            tar -xf vulkan-sdk.tar.xz \
              -C ~/vulkan-sdk

            rm vulkan-sdk.tar.xz
          fi

          VULKAN_SDK_VERSION=$(find ~/vulkan-sdk \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | head -n 1)

          VULKAN_SDK_ROOT="${HOME}/vulkan-sdk/${VULKAN_SDK_VERSION}"

          echo "VULKAN_SDK=${VULKAN_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${VULKAN_SDK_ROOT}/aarch64/bin" >> "$GITHUB_PATH"

          # Verify shader tools
          for tool in glslangValidator spirv-opt spirv-dis; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "Found $tool:"
              "$tool" --version 2>/dev/null || true
            else
              echo "Warning: $tool not found"
            fi
          done

      # 5. Download submodules
      - name: Download submodules
        run: |
            git submodule update \
            --init \
            --depth=1 \
            -j"$(nproc)" \
            $SUBMODULES

      # 6. Generate version.h
      - name: Generate version.h
        run: |
          mkdir -p build

          BRANCH=$(git symbolic-ref --short -q HEAD || echo "detached")
          COMMIT=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)

          cat <<EOF > build/version.h
          // Autogenerated for Native Linux ARM64 Build
          #ifndef GENERATED_VERSION_H_
          #define GENERATED_VERSION_H_

          #define XE_BUILD_BRANCH "$BRANCH"
          #define XE_BUILD_COMMIT "$COMMIT"
          #define XE_BUILD_COMMIT_SHORT "$COMMIT_SHORT"
          #define XE_BUILD_DATE __DATE__

          #endif // GENERATED_VERSION_H_
          EOF

      # 7. Manual CMake configuration
      #
      # IMPORTANT:
      # We intentionally do NOT use xenia-build.py here.
      # The ARM64 backend is already stable, but the automatic build
      # script is still designed around the x86 build path.
      - name: CMake Configure (Native ARM64)
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXENIA_BUILD_TESTS=OFF

      # 8. Build Xenia
      - name: Build Xenia via Ninja
        run: |
          cmake \
            --build build \
            --config Release \
            --target xenia-app \
            --parallel "$(nproc)"

      # 9. Prepare artifact
      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          binary="build/bin/Linux/Release/xenia_canary"

          if [ ! -f "$binary" ]; then
            echo "::error::Binary not found: $binary"
            exit 1
          fi

          if [ "$(stat -c%s "$binary")" -le 100000 ]; then
            echo "::error::Binary is too small."
            exit 1
          fi

          chmod +x "$binary"

          OUTPUT_ARCHIVE="xenia_canary_linux_arm64.7z"

          7z a \
            "$OUTPUT_ARCHIVE" \
            "$binary" \
            LICENSE \
            -mx9 \
            -bb3

          if [ ! -s "$OUTPUT_ARCHIVE" ]; then
            echo "::error::Archive generation failed."
            exit 1
          fi

          echo "path=$OUTPUT_ARCHIVE" >> "$GITHUB_OUTPUT"

      # 10. Upload artifact
      - name: Upload Xenia Canary Linux ARM64 artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
