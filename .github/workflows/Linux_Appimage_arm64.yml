name: Linux Appimage ARM64 Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: canary_experimental)'
        required: false
        default: 'canary_experimental'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}


      # 2. Fix SPIR-V shader compilation
      - name: Fix SPIR-V shader compilation
        run: |
          sed -i 's/"--canonicalize-ids",//g' \
            tools/build/compile_shader_spirv.py

          if grep -q -- '--canonicalize-ids' \
            tools/build/compile_shader_spirv.py; then
            echo "::error::--canonicalize-ids is still present."
            exit 1
          fi

          echo "SPIR-V shader compiler compatibility fix applied."


      # 3. Setup native ARM64 build environment
      - name: Setup build environment
        run: |

          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc \
            > /dev/null

          sudo add-apt-repository \
            "deb http://apt.llvm.org/$(lsb_release -cs)/ \
            llvm-toolchain-$(lsb_release -cs)-22 main"

          sudo apt-get update

          sudo apt-get install -y \
            mesa-vulkan-drivers \
            valgrind \
            libc++-dev \
            libc++abi-dev \
            libgtk-3-dev \
            libsdl2-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            clang-22 \
            lld-22 \
            spirv-tools \
            glslang-tools \
            p7zip-full \
            wget


          # Pin all LLVM tools to LLVM 22.
          # This keeps compiler, linker, LTO and LLVM utilities consistent.

          sudo update-alternatives --install \
            /usr/bin/clang \
            clang \
            /usr/bin/clang-22 \
            200

          sudo update-alternatives --install \
            /usr/bin/clang++ \
            clang++ \
            /usr/bin/clang++-22 \
            200

          sudo update-alternatives --install \
            /usr/bin/lld \
            lld \
            /usr/bin/lld-22 \
            200

          sudo update-alternatives --install \
            /usr/bin/ld.lld \
            ld.lld \
            /usr/bin/ld.lld-22 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-ar \
            llvm-ar \
            /usr/bin/llvm-ar-22 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-ranlib \
            llvm-ranlib \
            /usr/bin/llvm-ranlib-22 \
            200

          sudo update-alternatives --install \
            /usr/bin/llvm-nm \
            llvm-nm \
            /usr/bin/llvm-nm-22 \
            200


          echo "=== Compiler ==="
          clang --version
          clang++ --version

          echo "=== Linker ==="
          ld.lld --version

          echo "=== LLVM tools ==="
          llvm-ar --version
          llvm-ranlib --version
          llvm-nm --version

          echo "=== Shader tools ==="
          glslangValidator --version
          spirv-opt --version
          spirv-dis --version


      # 4. Download all submodules
      #
      # Exactly like the Windows ARM64 build:
      # no architecture-specific submodules are excluded.
      #
      # xbyak_aarch64 is required by the native ARM64 JIT backend.

      - name: Download submodules
        run: |
          git submodule update \
            --init \
            --depth=1 \
            -j"$(nproc)"


      # 5. Generate version.h
      - name: Generate version.h
        run: |

          mkdir -p build

          branch=$(git symbolic-ref --short -q HEAD || echo "detached")
          commit=$(git rev-parse HEAD)
          commit_short=$(git rev-parse --short HEAD)

          cat <<EOF > build/version.h
          // Autogenerated for Native ARM64 Build
          #ifndef GENERATED_VERSION_H_
          #define GENERATED_VERSION_H_

          #define XE_BUILD_BRANCH "$branch"
          #define XE_BUILD_COMMIT "$commit"
          #define XE_BUILD_COMMIT_SHORT "$commit_short"
          #define XE_BUILD_DATE __DATE__

          #endif // GENERATED_VERSION_H_
          EOF


      # 6. Native CMake configure
      #
      # We intentionally do not use xenia-build.py.
      # The build is configured directly for native ARM64.

      - name: CMake Configure (Native ARM64)
        env:
          CC: clang-22
          CXX: clang++-22
        run: |

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXENIA_BUILD_TESTS=OFF


      # 7. Build
      - name: Build via Ninja
        run: |

          cmake \
            --build build \
            --config Release \
            --target xenia-app \
            --parallel "$(nproc)"


      # 8. Install linuxdeploy
      - name: Install linuxdeploy
        run: |

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-aarch64.AppImage \
            -O linuxdeploy-aarch64.AppImage

          chmod +x linuxdeploy-aarch64.AppImage


      # 9. Prepare AppImage filesystem
      - name: Prepare AppImage
        run: |

          binary="build/bin/Linux/xenia_canary"

          if [ ! -f "$binary" ]; then
            echo "::error::Binary not found: $binary"
            exit 1
          fi

          chmod +x "$binary"


          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps


          # Copy Xenia
          cp "$binary" \
            AppDir/usr/bin/xenia_canary


          # Create valid application icon.
          # linuxdeploy requires Icon= in the desktop file
          # to point to an actual icon file.

          cat > AppDir/usr/share/icons/hicolor/scalable/apps/xenia.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="256"
               height="256"
               viewBox="0 0 256 256">

            <rect
              x="8"
              y="8"
              width="240"
              height="240"
              rx="48"
              fill="#202020"/>

            <path
              d="M64 64
                 L112 112
                 L64 160
                 L96 192
                 L144 144
                 L192 192
                 L224 160
                 L176 112
                 L224 64
                 L192 32
                 L144 80
                 L96 32
                 Z"
              fill="#ffffff"/>

          </svg>
          EOF


          # Desktop entry
          cat > AppDir/usr/share/applications/xenia.desktop <<'EOF'
          [Desktop Entry]
          Name=Xenia Canary
          Comment=Xbox 360 Emulator
          Exec=xenia_canary
          Icon=xenia
          Type=Application
          Categories=Game;Emulator;
          Terminal=false
          EOF


          # AppRun
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh

          HERE="$(dirname "$(readlink -f "$0")")"

          exec "$HERE/usr/bin/xenia_canary" "$@"
          EOF

          chmod +x AppDir/AppRun


      # 10. Build ARM64 AppImage
      - name: Build ARM64 AppImage
        run: |

          ARCH=aarch64 \
          ./linuxdeploy-aarch64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/xenia.desktop \
            --output appimage


      # 11. Rename AppImage
      - name: Rename AppImage
        run: |

          appimage=$(find . \
            -maxdepth 1 \
            -name "*.AppImage" \
            -type f \
            ! -name "linuxdeploy-aarch64.AppImage" \
            | head -n 1)

          if [ -z "$appimage" ]; then
            echo "::error::AppImage was not created."
            exit 1
          fi

          mv "$appimage" \
            xenia_canary_arm64_portable.AppImage

          chmod +x \
            xenia_canary_arm64_portable.AppImage


      # 12. Validate artifacts
      - name: Validate artifacts
        run: |

          binary="build/bin/Linux/xenia_canary"

          if [ ! -f "$binary" ]; then
            echo "::error::Xenia binary is missing."
            exit 1
          fi

          if [ "$(stat -c%s "$binary")" -le 100000 ]; then
            echo "::error::Binary is suspiciously small."
            exit 1
          fi


          appimage="xenia_canary_arm64_portable.AppImage"

          if [ ! -f "$appimage" ]; then
            echo "::error::AppImage is missing."
            exit 1
          fi

          if [ "$(stat -c%s "$appimage")" -le 100000 ]; then
            echo "::error::AppImage is suspiciously small."
            exit 1
          fi


          echo "=== Binary ==="
          file "$binary"

          echo "=== AppImage ==="
          file "$appimage"

          echo "=== Sizes ==="
          ls -lh \
            "$binary" \
            "$appimage"


      # 13. Upload raw ARM64 binary
      - name: Upload Xenia Canary ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: xenia-canary-linux-arm64
          path: build/bin/Linux/xenia_canary
          if-no-files-found: error
          retention-days: 7
          archive: false


      # 14. Upload ARM64 AppImage
      - name: Upload Xenia ARM64 portable AppImage
        uses: actions/upload-artifact@v7
        with:
          name: xenia-canary-arm64-portable-appimage
          path: xenia_canary_arm64_portable.AppImage
          if-no-files-found: error
          retention-days: 7
          archive: false
